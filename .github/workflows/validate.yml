name: Validate static quiz app

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check answer-timer-feedback.js
          node --check app.js
          node --check difficulty-filter.js
          node --check launch-flow.js
          node --check main.js
          node --check question-source.js
          node --check quiz-media.js

      - name: Run focused validation tests
        run: node tests/validate.mjs
