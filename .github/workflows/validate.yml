name: Validate static quiz app

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
      - "agent/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          find assets/js -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Run focused validation tests
        run: |
          node tests/validate.mjs
          node tests/answer-visual-state.mjs
          node tests/quiz-defaults.mjs
          node tests/navigation-priority.mjs
          node tests/quiz-presentation.mjs
          node tests/system-audio-flow.mjs
          node tests/audio-license.mjs
          node tests/static-review.mjs
