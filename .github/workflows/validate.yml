name: Validate static quiz app

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
      - "agent/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check answer-timer-feedback.js
          node --check answer-visual-state.js
          node --check app.js
          node --check difficulty-filter.js
          node --check launch-flow.js
          node --check main.js
          node --check question-source.js
          node --check question-speech.js
          node --check quiz-media.js
          node --check quiz-show-ui.js
          node --check system-audio-flow.js
          node --check voicevox-credit.js

      - name: Run focused validation tests
        run: |
          node tests/validate.mjs
          node tests/answer-visual-state.mjs
          node tests/system-audio-flow.mjs
          node tests/audio-license.mjs
